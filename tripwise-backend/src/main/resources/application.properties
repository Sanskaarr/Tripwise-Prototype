# TripWise Backend Configuration

# Server Configuration
server.port=8080

# Spring Boot Configuration
spring.application.name=tripwise-backend
spring.profiles.active=dev

# MongoDB Configuration
# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/tripwise-v4
spring.data.mongodb.database=tripwise-v4

# Logging Configuration
logging.level.com.tripwise=DEBUG
logging.level.org.springframework.web=INFO
logging.level.reactor.netty=INFO

# AI API Configuration (NEVER commit actual API keys)
# Set these as environment variables in .env file
openai.api.key=${OPENAI_API_KEY}
perplexity.api.key=${PERPLEXITY_API_KEY}

# WebFlux Configuration
spring.webflux.multipart.enabled=true
spring.codec.max-in-memory-size=10MB

# WebClient Configuration
spring.webflux.client.max-in-memory-size=1MB
spring.webflux.client.max-initial-line-length=1024
spring.webflux.client.connect-timeout=10s
spring.webflux.client.response-timeout=90s

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8082,http://localhost:5173,http://localhost:5174,http://localhost:4173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Response Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
