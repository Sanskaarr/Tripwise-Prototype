# Server Configuration
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.tripwise=DEBUG

# Spring Data MongoDB (Standard connection string pattern)
spring.data.mongodb.uri=mongodb://localhost:27017/tripwise-v4

# Application Name
spring.application.name=tripwise-backend

# API Keys Mapping
openai.api.key=${OPENAI_API_KEY}
perplexity.api.key=${PERPLEXITY_API_KEY}
