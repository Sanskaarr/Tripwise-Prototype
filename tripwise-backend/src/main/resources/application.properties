# Server Configuration
server.port=${PORT:8080}
spring.mvc.async.request-timeout=120000

# Logging
logging.level.root=INFO
logging.level.com.tripwise=DEBUG

# Spring Data MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tripwise-v4}

# Application Name
spring.application.name=tripwise-backend

# JWT
jwt.secret=${JWT_SECRET}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# API Keys
gemini.api.key=${GEMINI_API_KEY:}

# Razorpay
razorpay.key.id=${RAZORPAY_API_KEY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Auth cookie — set SECURE_COOKIE=true in production (requires HTTPS)
server.cookie.secure=${SECURE_COOKIE:false}

# Default user country for trip planning (Indian OTA)
app.default.user.country=${DEFAULT_USER_COUNTRY:India}
