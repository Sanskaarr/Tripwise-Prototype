spring.application.name=tripwise-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tripwise}
spring.data.mongodb.database=tripwise
de.flapdoodle.mongodb.embedded.version=6.0.8

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-this-in-production-tripwise-2025
jwt.expiration=86400000

# API Keys
openai.api.key=${OPENAI_API_KEY:${VITE_OPENAI_API_KEY:}}
gemini.api.key=${GEMINI_API_KEY:${VITE_GEMINI_API_KEY:}}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s
gemini.model=gemini-1.5-flash
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.tripwise=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG