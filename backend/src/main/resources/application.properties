spring.application.name=tripwise-backend
server.port=8080

# Database Configuration (H2 in-memory for easy development)
spring.datasource.url=jdbc:h2:mem:tripwise
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-this-in-production-tripwise-2025
jwt.expiration=86400000

# API Keys
openai.api.key=${OPENAI_API_KEY:${VITE_OPENAI_API_KEY:}}
gemini.api.key=${GEMINI_API_KEY:${VITE_GEMINI_API_KEY:}}
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.tripwise=DEBUG
logging.level.org.springframework.security=DEBUG