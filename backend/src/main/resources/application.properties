spring.application.name=tripwise-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/tripwise?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-this-in-production-tripwise-2025
jwt.expiration=86400000

# API Keys
openai.api.key=${VITE_OPENAI_API_KEY}
gemini.api.key=${VITE_GEMINI_API_KEY}
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.tripwise=DEBUG
logging.level.org.springframework.security=DEBUG
